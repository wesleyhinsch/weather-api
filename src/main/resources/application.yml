server:
  port: 8080

spring:
  application:
    name: weather-api


  datasource:
    url: jdbc:h2:file:./data/weatherdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

openweathermap:
  api-key: ${OPENWEATHERMAP_API_KEY}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
